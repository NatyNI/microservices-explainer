<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Auth Service — schematic interactiv (DEV)</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2d3348;
      --text: #e8eaef;
      --muted: #8b93a7;
      --accent: #4f8ff7;
      --accent-dim: #2a4570;
      --active: #3dd68c;
      --danger: #e85d5d;
      --danger-dim: #3d1f1f;
      --connected: #2d5a3d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }
    h1 { font-size: 1.35rem; font-weight: 600; margin: 0 0 6px; }
    .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; max-width: 680px; line-height: 1.5; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .tab.active { border-color: var(--accent); color: var(--text); background: var(--accent-dim); }
    .panel {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      max-width: 960px;
    }
    .panel.active { display: block; }
    .diagram {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      flex-wrap: wrap;
      margin: 24px 0 8px;
      min-height: 110px;
    }
    .node {
      position: relative;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
      min-width: 110px;
      text-align: center;
      transition: border-color 0.25s, background 0.25s, opacity 0.25s, transform 0.15s;
      cursor: pointer;
    }
    .node:hover { border-color: var(--muted); }
    .node.active { border-color: var(--active); background: #152318; transform: scale(1.03); }
    .node.connected { border-color: var(--active); background: var(--connected); }
    .node.revoked { border-color: var(--danger); background: var(--danger-dim); opacity: 0.85; }
    .node .label { font-weight: 600; font-size: 0.92rem; }
    .node .url { font-size: 0.68rem; color: var(--muted); margin-top: 6px; line-height: 1.3; }
    .badge {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.65rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .badge.ok { background: #1a3d28; color: var(--active); }
    .badge.off { background: var(--danger-dim); color: var(--danger); }
    .arrow { color: var(--muted); font-size: 1.3rem; padding: 0 6px; user-select: none; }
    .arrow.event { color: var(--danger); font-size: 0.75rem; max-width: 72px; text-align: center; line-height: 1.2; }
    .step-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
      margin-top: 8px;
    }
    .step-box h2 { margin: 0 0 8px; font-size: 1rem; color: var(--accent); }
    .step-box.revoke h2 { color: var(--danger); }
    .step-box p { margin: 0 0 6px; line-height: 1.55; font-size: 0.92rem; }
    .step-box .meta { color: var(--muted); font-size: 0.82rem; }
    .controls { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .progress { color: var(--muted); font-size: 0.85rem; margin-bottom: 8px; }
    .hint {
      margin-top: 20px;
      padding: 12px 14px;
      border-left: 3px solid var(--accent);
      background: var(--bg);
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.5;
      max-width: 960px;
    }
    .app-status {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      display: none;
    }
    .app-status.show { display: block; }
    .app-status.in { background: var(--connected); border: 1px solid var(--active); color: var(--active); }
    .app-status.out { background: var(--danger-dim); border: 1px solid var(--danger); color: #f5a8a8; }
  </style>
</head>
<body>
  <h1>Auth Service — schematic interactiv</h1>
  <p class="sub">
    DEV — click pe cutii sau folosește butoanele. Tab <strong>Revoke</strong>: vezi cum dispar accesul
    din auth și din app theMarketer (sendm).
  </p>

  <div class="tabs">
    <button type="button" class="tab active" data-flow="browser">Login browser</button>
    <button type="button" class="tab" data-flow="revoke">Revoke acces</button>
  </div>

  <div id="panel-browser" class="panel active">
    <div class="diagram" id="diag-browser"></div>
    <p class="progress" id="prog-browser"></p>
    <div class="step-box" id="box-browser">
      <h2 id="title-browser"></h2>
      <p id="text-browser"></p>
      <p class="meta" id="meta-browser"></p>
    </div>
    <div class="controls">
      <button type="button" class="ghost" id="prev-browser">Înapoi</button>
      <button type="button" id="next-browser">Următorul pas</button>
      <button type="button" class="ghost" id="play-browser">Auto ▶</button>
    </div>
  </div>

  <div id="panel-revoke" class="panel">
    <div class="diagram" id="diag-revoke"></div>
    <div id="app-status-revoke" class="app-status"></div>
    <p class="progress" id="prog-revoke"></p>
    <div class="step-box revoke" id="box-revoke">
      <h2 id="title-revoke"></h2>
      <p id="text-revoke"></p>
      <p class="meta" id="meta-revoke"></p>
    </div>
    <div class="controls">
      <button type="button" class="ghost" id="prev-revoke">Înapoi</button>
      <button type="button" id="next-revoke">Următorul pas</button>
      <button type="button" class="ghost" id="play-revoke">Auto ▶</button>
    </div>
  </div>

  <p class="hint">
    Login = auth dă acces. Revoke = auth retrage token-urile → sendm primește eveniment → sesiune distrusă → user văzut deconectat în app.
  </p>

  <script>
    const FLOWS = {
      browser: {
        nodes: [
          { id: "user", label: "Utilizator", url: "" },
          { id: "app", label: "App sendm", url: "app.dev.themarketer.dev" },
          { id: "auth", label: "Auth", url: "auth.dev.themarketer.dev" },
        ],
        steps: [
          { active: "user", title: "Pas 1 — Login", text: "Apasă Login with theMarketerID.", meta: "Redirect către auth" },
          { active: "auth", title: "Pas 2 — Auth", text: "Autentificare email / Google.", meta: "Identitate verificată" },
          { active: "auth", title: "Pas 3 — Sesiune", text: "Cookie sesiune (sm_auth_session).", meta: "Browser → sendm" },
          { active: "app", title: "Pas 4 — App", text: "User logat în theMarketer.", meta: "Acces activ", appState: "in" },
        ],
      },
      revoke: {
        nodes: [
          { id: "user", label: "Utilizator", url: "" },
          { id: "portal", label: "Auth portal", url: "Cont → Aplicații conectate" },
          { id: "auth", label: "Auth", url: "auth.dev.themarketer.dev" },
          { id: "app", label: "App sendm", url: "app.dev.themarketer.dev" },
        ],
        steps: [
          {
            active: "app",
            title: "Pas 1 — Conectat",
            text: "User e logat în app theMarketer (sendm). Token/sesiune validă.",
            meta: "Stare: ACCES ACTIV",
            appState: "in",
            styles: { app: "connected" },
          },
          {
            active: "portal",
            title: "Pas 2 — Portal auth",
            text: "User deschide contul theMarketerID → Aplicații conectate.",
            meta: "auth.dev — setări cont",
            appState: "in",
            styles: { app: "connected" },
          },
          {
            active: "portal",
            title: "Pas 3 — Revoke",
            text: 'Apasă „Revoke access” / elimină acces pentru app sendm.',
            meta: "POST .../applications/{clientId}/revoke",
            appState: "in",
            styles: { app: "connected" },
          },
          {
            active: "auth",
            title: "Pas 4 — Auth revocă",
            text: "Auth marchează token-urile revoked. Introspect → active: false.",
            meta: "Token-urile nu mai sunt valide",
            appState: "in",
            styles: { app: "connected" },
          },
          {
            active: "auth",
            title: "Pas 5 — Notificare",
            text: "Auth trimite eveniment (NATS) către sendm: acces revocat.",
            meta: "UserAccessRevoked",
            appState: "in",
            styles: { app: "connected" },
            showEventArrow: true,
          },
          {
            active: "app",
            title: "Pas 6 — Sendm reacționează",
            text: "Sendm șterge sesiunile browser + cache introspect.",
            meta: "Backend — RevokeUserAccess listener",
            appState: "out",
            styles: { app: "revoked" },
          },
          {
            active: "app",
            title: "Pas 7 — Deconectat în UI",
            text: 'App primește realtime → toast „Access revoked” → redirect login.',
            meta: "User vede că nu mai are acces",
            appState: "out",
            styles: { app: "revoked" },
          },
        ],
      },
    };

    const state = { browser: 0, revoke: 0 };
    let autoTimer = null;

    function nodeClasses(node, step) {
      let c = "node";
      if (node.id === step.active) c += " active";
      if (step.styles && step.styles[node.id] === "connected") c += " connected";
      if (step.styles && step.styles[node.id] === "revoked") c += " revoked";
      return c;
    }

    function badgeFor(node, step) {
      if (node.id !== "app") return "";
      if (step.appState === "in") return '<span class="badge ok">Conectat</span>';
      if (step.appState === "out") return '<span class="badge off">Deconectat</span>';
      return "";
    }

    function renderDiagram(flowId) {
      const wrap = document.getElementById("diag-" + flowId);
      const flow = FLOWS[flowId];
      const step = flow.steps[state[flowId]];
      wrap.innerHTML = "";

      flow.nodes.forEach((node, i) => {
        if (i > 0) {
          const arr = document.createElement("span");
          const isEvent =
            flowId === "revoke" &&
            step.showEventArrow &&
            flow.nodes[i - 1].id === "auth" &&
            node.id === "app";
          arr.className = isEvent ? "arrow event" : "arrow";
          arr.textContent = isEvent ? "eveniment NATS →" : "→";
          wrap.appendChild(arr);
        }
        const el = document.createElement("div");
        el.className = nodeClasses(node, step);
        el.innerHTML =
          '<div class="label">' +
          node.label +
          "</div>" +
          (node.url ? '<div class="url">' + node.url + "</div>" : "") +
          badgeFor(node, step);
        el.addEventListener("click", () => {
          const idx = flow.steps.findIndex((s) => s.active === node.id);
          if (idx >= 0) setStep(flowId, idx);
        });
        wrap.appendChild(el);
      });

      const statusEl = document.getElementById("app-status-" + flowId);
      if (statusEl) {
        statusEl.className = "app-status";
        if (step.appState === "in") {
          statusEl.textContent = "App theMarketer: user CONECTAT (sesiune validă)";
          statusEl.classList.add("show", "in");
        } else if (step.appState === "out") {
          statusEl.textContent = "App theMarketer: user DECONECTAT (acces revocat din auth)";
          statusEl.classList.add("show", "out");
        }
      }
    }

    function renderStep(flowId) {
      const flow = FLOWS[flowId];
      const step = flow.steps[state[flowId]];
      document.getElementById("title-" + flowId).textContent = step.title;
      document.getElementById("text-" + flowId).textContent = step.text;
      document.getElementById("meta-" + flowId).textContent = step.meta;
      document.getElementById("prog-" + flowId).textContent =
        "Pas " + (state[flowId] + 1) + " / " + flow.steps.length;
      document.getElementById("prev-" + flowId).disabled = state[flowId] === 0;
      document.getElementById("next-" + flowId).disabled =
        state[flowId] >= flow.steps.length - 1;
      renderDiagram(flowId);
    }

    function setStep(flowId, idx) {
      state[flowId] = Math.max(0, Math.min(FLOWS[flowId].steps.length - 1, idx));
      renderStep(flowId);
    }

    function switchFlow(flowId) {
      clearInterval(autoTimer);
      autoTimer = null;
      document.querySelectorAll(".tab").forEach((t) => {
        t.classList.toggle("active", t.dataset.flow === flowId);
      });
      document.querySelectorAll(".panel").forEach((p) => {
        p.classList.toggle("active", p.id === "panel-" + flowId);
      });
      document.querySelectorAll('[id^="play-"]').forEach((b) => {
        b.textContent = "Auto ▶";
      });
      renderStep(flowId);
    }

    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => switchFlow(tab.dataset.flow));
    });

    Object.keys(FLOWS).forEach((flowId) => {
      document.getElementById("prev-" + flowId).addEventListener("click", () => {
        setStep(flowId, state[flowId] - 1);
      });
      document.getElementById("next-" + flowId).addEventListener("click", () => {
        setStep(flowId, state[flowId] + 1);
      });
      document.getElementById("play-" + flowId).addEventListener("click", () => {
        const btn = document.getElementById("play-" + flowId);
        if (autoTimer) {
          clearInterval(autoTimer);
          autoTimer = null;
          btn.textContent = "Auto ▶";
          return;
        }
        btn.textContent = "Stop ■";
        setStep(flowId, 0);
        autoTimer = setInterval(() => {
          if (state[flowId] >= FLOWS[flowId].steps.length - 1) {
            clearInterval(autoTimer);
            autoTimer = null;
            btn.textContent = "Auto ▶";
            return;
          }
          setStep(flowId, state[flowId] + 1);
        }, 2000);
      });
    });

    switchFlow("browser");
  </script>
</body>
</html>
