<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Schematică interactivă Auth Service — login browser și revoke acces." />
  <title>Auth Service — schematic interactiv</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2d3348;
      --text: #e8eaef;
      --muted: #8b93a7;
      --accent: #0066e0;
      --accent-dim: #1a3a5c;
      --active: #3dd68c;
      --danger: #e85d5d;
      --danger-dim: #3d1f1f;
      --connected: #2d5a3d;
      --tm-blue: #0066e0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    .page { flex: 1; max-width: 960px; margin: 0 auto; padding: 24px; width: 100%; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .back {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.88rem;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: color 0.15s;
    }
    .back:hover { color: var(--accent); }
    .topbar-actions { display: flex; align-items: center; gap: 8px; }
    .lang-switch {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.03);
    }
    .lang-switch button {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 6px 10px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.04em;
    }
    .lang-switch button:hover { color: var(--text); }
    .lang-switch button.active {
      background: var(--accent-dim);
      color: var(--text);
    }
    .brand-mark {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--tm-blue);
      letter-spacing: -0.02em;
    }
    .brand-mark span { color: var(--text); }
    h1 { font-size: 1.35rem; font-weight: 600; margin: 0 0 20px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: border-color 0.15s, background 0.15s;
    }
    .tab:hover { border-color: var(--muted); color: var(--text); }
    .tab.active { border-color: var(--accent); color: var(--text); background: var(--accent-dim); }
    .panel {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }
    .panel.active { display: block; }
    .diagram-wrap { width: 100%; }
    .diagram {
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin: 24px 0 8px;
      min-height: 150px;
    }
    .node {
      position: relative;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 24px 20px;
      flex: 1 1 160px;
      max-width: 240px;
      min-width: 150px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: border-color 0.25s, background 0.25s, opacity 0.25s, transform 0.15s, box-shadow 0.25s;
      cursor: default;
      user-select: none;
      pointer-events: none;
    }
    .node.active {
      border-color: var(--active);
      background: #152318;
      transform: scale(1.03);
      box-shadow: 0 0 0 3px rgba(61, 214, 140, 0.15);
    }
    .node.connected { border-color: var(--active); background: var(--connected); }
    .node.revoked { border-color: var(--danger); background: var(--danger-dim); opacity: 0.85; }
    .node.revoked.active {
      border-color: var(--danger);
      background: var(--danger-dim);
      box-shadow: 0 0 0 3px rgba(232, 93, 93, 0.2);
      transform: scale(1.03);
    }
    .node.pending {
      border-color: #4a5568;
      background: #1a1f2e;
      opacity: 0.92;
    }
    .badge.pending {
      background: #2a3040;
      color: var(--muted);
    }
    .diagram.hub-diagram {
      flex-direction: column;
      align-items: center;
      gap: 0;
      min-height: 300px;
      padding: 4px 0 12px;
    }
    .hub-stage {
      position: relative;
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hub-badge-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .hub-pill {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      background: #1a1f2e;
      letter-spacing: 0.01em;
    }
    .hub-pill.on {
      border-color: var(--active);
      color: var(--active);
      background: #152318;
    }
    .hub-pill.pending {
      border-color: #4a5568;
      color: var(--muted);
      opacity: 0.8;
    }
    .hub-center .node {
      max-width: 300px;
      min-width: 220px;
    }
    .hub-center .node.node-portal {
      max-width: 340px;
      min-width: 280px;
    }
    .hub-links {
      width: 100%;
      max-width: 520px;
      margin: 2px 0 6px;
    }
    .hub-svg {
      width: 100%;
      height: auto;
      display: block;
    }
    .hub-line {
      stroke: #3a4255;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.3s, stroke-width 0.3s, opacity 0.3s;
    }
    .hub-line.on {
      stroke: var(--active);
      stroke-width: 2.5;
    }
    .hub-line.highlight {
      stroke: var(--accent);
      stroke-width: 3;
      animation: pulse 1.2s ease infinite;
    }
    .hub-line.off {
      stroke-dasharray: 6 5;
      opacity: 0.55;
    }
    .hub-apps {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      width: 100%;
    }
    .hub-apps .node {
      flex: 1 1 180px;
      max-width: 220px;
      min-width: 160px;
    }
    .step-box.hub h2 { color: #60a5fa; }
    .portal-card + .portal-card { margin-top: 6px; }
    .hub-apps.three-apps .node {
      flex: 1 1 140px;
      max-width: 180px;
      min-width: 130px;
      padding: 18px 14px;
    }
    .hub-apps.three-apps .node .icon { font-size: 1.9rem; }
    .portal-avatar.sendm { background: var(--tm-blue); }
    .portal-avatar.partners { background: #7c3aed; }
    .node .icon { font-size: 2.4rem; margin-bottom: 10px; line-height: 1; }
    .node .icon-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
      line-height: 1;
    }
    .node .icon-row .icon-emoji { font-size: 2.4rem; }
    .node .icon-row .id-mark {
      width: 36px;
      height: 36px;
      display: block;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0, 102, 224, 0.35);
    }
    .node .label { font-weight: 700; font-size: 1.05rem; letter-spacing: -0.01em; }
    .badge {
      display: inline-block;
      margin-top: 12px;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      letter-spacing: 0.02em;
    }
    .badge.ok { background: #1a3d28; color: var(--active); }
    .badge.off { background: var(--danger-dim); color: var(--danger); }
    .badge.guest { background: #2a3040; color: var(--muted); }
    .node-hint {
      margin-top: 12px;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 600;
      line-height: 1.25;
      background: #2a4570;
      border: 1px solid var(--accent);
      color: #fff;
      max-width: 100%;
    }
    .node-hint.emphasis {
      animation: pulse 1.2s ease infinite;
      box-shadow: 0 0 0 2px rgba(0, 102, 224, 0.35);
    }
    .node-action {
      margin-top: 10px;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 0.68rem;
      font-weight: 700;
      line-height: 1.3;
      max-width: 100%;
      text-align: center;
    }
    .node-action.passive {
      background: #2a3040;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .node-action.user {
      background: #2a4570;
      border: 1px solid var(--accent);
      color: #fff;
    }
    .node-action.auth {
      background: #1a3d28;
      border: 1px solid var(--active);
      color: var(--active);
    }
    .node-action.sa {
      background: #3d2a10;
      border: 1px solid #e8a838;
      color: #ffc966;
    }
    .node-action.emphasis {
      animation: pulse 1.2s ease infinite;
    }
    .node-action.user.emphasis {
      box-shadow: 0 0 0 2px rgba(0, 102, 224, 0.45);
    }
    .node-action.auth.emphasis {
      box-shadow: 0 0 0 2px rgba(61, 214, 140, 0.45);
    }
    .node-action.sa.emphasis {
      box-shadow: 0 0 0 2px rgba(232, 168, 56, 0.45);
    }
    .node.node-acting {
      box-shadow: 0 0 0 3px rgba(232, 168, 56, 0.25);
    }
    .node-mockup {
      margin-top: 12px;
      width: 100%;
      background: #fff;
      border-radius: 8px;
      padding: 10px 8px;
      text-align: center;
    }
    .node-mockup .mock-logo {
      color: var(--tm-blue);
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .node-mockup .mock-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
      background: var(--tm-blue);
      color: #fff;
      font-size: 0.52rem;
      font-weight: 600;
      padding: 6px 8px;
      border-radius: 999px;
      line-height: 1.2;
    }
    .node-mockup .mock-btn .id-mark {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }
    .node-mockup .mock-btn.emphasis {
      animation: pulse 1.2s ease infinite;
      box-shadow: 0 0 0 2px rgba(0, 102, 224, 0.4);
    }
    .node-mockup-logout { text-align: left; padding: 10px; }
    .node-mockup-logout .mock-title {
      color: #333;
      font-size: 0.55rem;
      font-weight: 700;
      margin-bottom: 8px;
      text-align: center;
    }
    .node-mockup-logout .mock-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .node-mockup-logout .mock-btn-outline {
      background: #fff;
      color: #333;
      border: 1px solid #ccc;
      font-size: 0.5rem;
      padding: 5px 6px;
      border-radius: 6px;
      text-align: center;
      font-weight: 600;
    }
    .node-mockup-logout .mock-btn-danger {
      background: #dc3545;
      color: #fff;
      font-size: 0.5rem;
      padding: 5px 6px;
      border-radius: 6px;
      text-align: center;
      font-weight: 600;
    }
    .node-mockup-logout .mock-btn-outline.emphasis,
    .node-mockup-logout .mock-btn-danger.emphasis {
      animation: pulse 1.2s ease infinite;
      box-shadow: 0 0 0 2px rgba(0, 102, 224, 0.45);
    }
    .node.node-portal {
      max-width: 320px;
      min-width: 260px;
      padding: 16px 14px 14px;
    }
    .node.node-portal .label { font-size: 0.82rem; margin-bottom: 2px; }
    .node.node-portal .icon-row { margin-bottom: 6px; }
    .node.node-portal .icon-row .icon-emoji { font-size: 1.6rem; }
    .node.node-portal .icon-row .id-mark { width: 28px; height: 28px; }
    .node-mockup-portal {
      margin-top: 8px;
      width: 100%;
      background: #f8fafc;
      border-radius: 10px;
      padding: 10px 10px 8px;
      text-align: left;
      border: 1px solid #e2e8f0;
    }
    .node-mockup-portal .portal-title {
      color: #0f172a;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .node-mockup-portal .portal-intro {
      color: #64748b;
      font-size: 0.48rem;
      line-height: 1.35;
      margin-top: 4px;
      margin-bottom: 8px;
    }
    .node-mockup-portal .portal-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 8px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
    }
    .node-mockup-portal .portal-app-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .node-mockup-portal .portal-avatar {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #0066e0, #3d8ef0);
      color: #fff;
      font-size: 0.58rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .node-mockup-portal .portal-app-meta {
      flex: 1;
      min-width: 0;
    }
    .node-mockup-portal .portal-app-name {
      color: #0f172a;
      font-size: 0.54rem;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .node-mockup-portal .portal-app-date {
      color: #94a3b8;
      font-size: 0.44rem;
      margin-top: 2px;
      line-height: 1.2;
    }
    .node-mockup-portal .portal-revoke-btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 4px 6px;
      border-radius: 8px;
      border: 1px solid #fecaca;
      background: #fff;
      color: #dc2626;
      font-size: 0.42rem;
      font-weight: 600;
      line-height: 1.2;
      white-space: nowrap;
    }
    .node-mockup-portal .portal-revoke-btn svg {
      width: 10px;
      height: 10px;
      flex-shrink: 0;
    }
    .node-mockup-portal .portal-revoke-btn.emphasis {
      background: #fef2f2;
      border-color: #f87171;
      animation: pulse 1.2s ease infinite;
      box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.25);
    }
    .node-mockup-login {
      margin-top: 8px;
      width: 100%;
      background: #fff;
      border-radius: 10px;
      padding: 10px 10px 8px;
      text-align: left;
      border: 1px solid #e2e8f0;
    }
    .node-mockup-login .login-title {
      color: #0f172a;
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      text-align: center;
    }
    .node-mockup-login .login-field {
      margin-bottom: 6px;
    }
    .node-mockup-login .login-label {
      display: block;
      color: #64748b;
      font-size: 0.42rem;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .node-mockup-login .login-input-row {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 4px 6px;
    }
    .node-mockup-login .login-input-row.ok {
      border-color: #86efac;
      background: #f0fdf4;
    }
    .node-mockup-login .login-value {
      flex: 1;
      color: #0f172a;
      font-size: 0.44rem;
      line-height: 1.2;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .node-mockup-login .login-check {
      flex-shrink: 0;
      width: 14px;
      height: 14px;
      border-radius: 999px;
      background: #22c55e;
      color: #fff;
      font-size: 0.42rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .node-mockup-login .login-success {
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 5px 6px;
      border-radius: 8px;
      background: #dcfce7;
      border: 1px solid #86efac;
      color: #15803d;
      font-size: 0.44rem;
      font-weight: 700;
      line-height: 1.2;
    }
    .node-mockup-branch {
      margin-top: 8px;
      width: 100%;
      background: #fff;
      border-radius: 10px;
      padding: 8px;
      text-align: left;
      border: 1px solid #e2e8f0;
    }
    .node-mockup-branch .branch-heading {
      color: #0f172a;
      font-size: 0.5rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }
    .node-mockup-branch .branch-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .node-mockup-branch .branch-col {
      border-radius: 8px;
      padding: 6px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
    }
    .node-mockup-branch .branch-col.with-session {
      border-color: #86efac;
      background: #f0fdf4;
    }
    .node-mockup-branch .branch-col-title {
      font-size: 0.44rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 2px;
    }
    .node-mockup-branch .branch-col-desc {
      font-size: 0.4rem;
      color: #64748b;
      line-height: 1.25;
      margin-bottom: 6px;
    }
    .node-mockup-branch .branch-field {
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      padding: 3px 5px;
      font-size: 0.38rem;
      color: #475569;
      margin-bottom: 4px;
    }
    .node-mockup-branch .branch-google {
      font-size: 0.38rem;
      color: #64748b;
      text-align: center;
      margin-top: 2px;
    }
    .node-mockup-branch .branch-session-ok {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px;
      border-radius: 6px;
      background: #dcfce7;
      border: 1px solid #86efac;
      color: #15803d;
      font-size: 0.4rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .node-mockup-branch .branch-skip {
      font-size: 0.38rem;
      color: #15803d;
      font-weight: 600;
      line-height: 1.25;
    }
    .node-mockup-branch .branch-foot {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed #cbd5e1;
      font-size: 0.38rem;
      color: #475569;
      text-align: center;
      line-height: 1.3;
    }
    .step-box.logout h2 { color: #e8a838; }
    .step-box.migrate h2 { color: #e8a838; }
    .diagram.three-nodes .node { max-width: 200px; min-width: 120px; flex: 1 1 120px; }
    .nats-return {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--danger-dim);
      border: 1px dashed var(--danger);
      color: #f5a8a8;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .nats-return.show { display: flex; flex-wrap: wrap; }
    .nats-return .nats-arrow {
      color: var(--danger);
      font-size: 1.2rem;
      animation: pulse 1s ease infinite;
    }
    .arrow { color: var(--muted); font-size: 1.5rem; padding: 0 4px; user-select: none; transition: color 0.25s; align-self: center; }
    .arrow.flow-active { color: var(--accent); animation: pulse 1s ease infinite; }
    .arrow.pulse { color: var(--danger); animation: pulse 1s ease infinite; }
    .arrow.redirect { color: var(--accent); font-size: 0.8rem; animation: pulse 1s ease infinite; }
    .arrow.event { color: var(--danger); font-size: 0.75rem; max-width: 72px; text-align: center; line-height: 1.2; }
    .event-return { display: none; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
    .step-box .meta a { color: var(--accent); text-decoration: none; }
    .step-box .meta a:hover { text-decoration: underline; }
    .step-summary {
      margin: 12px 0 0;
      padding: 0 0 0 18px;
      color: var(--active);
      font-size: 0.85rem;
      line-height: 1.6;
    }
    .step-summary li { margin-bottom: 4px; }
    .step-checklist {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
      padding-top: 12px;

    .step-box {

  <script>
    const NODE_ICONS = { app: "🖥️", sa: "🖥️", sendm: "📱", partners: "🤝", auth: "🔐", portal: "⚙️" };
    const HUB_PARTNERS_KEY = "explainer-hub-partners";
    const ID_MARK = "assets/themarketer-id-mark.svg";

    let hubPartnersMode = false;
    try {
      hubPartnersMode = sessionStorage.getItem(HUB_PARTNERS_KEY) === "1";
    } catch (e) {
      /* ignore */
    }

    function nodeIconHtml(node) {
      if (node.id === "auth") {
        return (
          '<div class="icon-row">' +
          '<span class="icon-emoji">🔐</span>' +
          '<img class="id-mark" src="' + ID_MARK + '" alt="theMarketerID" width="36" height="36" />' +
          "</div>"
        );
      }
      return '<div class="icon">' + (NODE_ICONS[node.id] || "•") + "</div>";
    }

    function getUi() {
      return ExplainerI18n.ui("auth");
    }

    let FLOWS = ExplainerI18n.flows();

    function applyPageLang() {
      const u = getUi();
      document.title = u.title;
      const meta = document.querySelector('meta[name="description"]');
      if (meta) meta.setAttribute("content", u.metaDescription);
      document.getElementById("back-link").textContent = u.back;
      document.getElementById("page-h1").textContent = u.title;
      document.querySelectorAll(".tab").forEach(function (tab) {
        tab.textContent = u.tabs[tab.dataset.flow];
      });
      PANEL_IDS.forEach(function (panelId) {
        document.getElementById("prev-" + panelId).textContent = u.prev;
        document.getElementById("next-" + panelId).textContent = u.next;
        document.getElementById("reset-" + panelId).textContent = u.reset;
        document.getElementById("share-" + panelId).textContent = u.share;
        const playBtn = document.getElementById("play-" + panelId);
        const playFlow = panelId === "browser" ? currentFlow : panelId;
        if (!autoTimer || !isActiveFlow(playFlow)) {
          playBtn.textContent = u.play;
        }
      });
      const presentBtn = document.getElementById("present-toggle");
      presentBtn.textContent = document.body.classList.contains("present")
        ? u.presentExit
        : u.present;
    }

    function reloadLang() {
      FLOWS = ExplainerI18n.flows();
      applyPageLang();
      Object.keys(FLOWS).forEach(function (flowId) {
        if (isLoginFlow(flowId) && flowId !== currentFlow) return;
        renderStep(flowId);
      });
      switchFlow(isLoginFlow(currentFlow) ? "browser" : currentFlow);
    }

    const LOGIN_FLOWS = ["browserNoSession", "browserWithSession"];
    const PANEL_IDS = ["browser", "revoke", "logoutApp", "logoutComplete", "appsOnAuth"];
    const state = {
      browserNoSession: 0,
      browserWithSession: 0,
      revoke: 0,
      logoutApp: 0,
      logoutComplete: 0,
      appsOnAuth: 0,
    };
    let currentFlow = "browserNoSession";
    let autoTimer = null;
    let autoPlayFlow = null;

    function isLoginFlow(flowId) {
      return LOGIN_FLOWS.indexOf(flowId) >= 0;
    }

    function panelIdForFlow(flowId) {
      return isLoginFlow(flowId) ? "browser" : flowId;
    }

    function isActiveFlow(flowId) {
      return currentFlow === flowId;
    }

    function activeFlowForPanel(panelId) {
      if (panelId === "browser") {
        return isLoginFlow(currentFlow) ? currentFlow : "browserNoSession";
      }
      return panelId;
    }

    function switchLoginScenario(flowId) {
      clearInterval(autoTimer);
      autoTimer = null;
      autoPlayFlow = null;
      document.getElementById("play-browser").textContent = getUi().play;
      currentFlow = flowId;
      state[flowId] = 0;
      renderStep(flowId);
      updateHash();
    }

    function nodeClasses(node, step) {
      let c = "node";
      const isActive =
        node.id === step.active ||
        (step.activeNodes && step.activeNodes.indexOf(node.id) >= 0);
      if (isActive) c += " active";
      if (step.styles && step.styles[node.id] === "connected") c += " connected";
      if (step.styles && step.styles[node.id] === "revoked") c += " revoked";
      if (step.styles && step.styles[node.id] === "pending") c += " pending";
      if (node.id === "auth" && (step.showConnectedAppsMockup || step.showDualConnectedAppsMockup || step.showTripleConnectedAppsMockup || step.showLoginVerifyMockup || step.showLoginNoSessionMockup || step.showLoginWithSessionMockup))
        c += " node-portal";
      if (
        step.nodeActions &&
        step.nodeActions[node.id] &&
        step.nodeActions[node.id].emphasis
      )
        c += " node-acting";
      return c;
    }

    function augmentHubStep(step) {
      if (!hubPartnersMode || currentFlow !== "appsOnAuth") return step;
      const h = getUi().hub || {};
      const out = Object.assign({}, step);
      out.styles = Object.assign({}, step.styles || {});
      out.hubLinks = Object.assign({}, step.hubLinks || {});
      const sendmState = step.styles && step.styles.sendm;
      if (sendmState === "connected") {
        out.styles.partners = "connected";
        out.hubLinks.partners = true;
      } else if (sendmState === "pending") {
        out.styles.partners = "pending";
        out.hubLinks.partners = false;
      }
      if (step.nodeActions) {
        out.nodeActions = Object.assign({}, step.nodeActions);
        if (sendmState === "connected" && !out.nodeActions.partners) {
          out.nodeActions.partners = {
            text: h.partnersConnected || "Connected via auth",
            kind: "passive",
          };
        } else if (sendmState === "pending" && !out.nodeActions.partners) {
          out.nodeActions.partners = {
            text: h.partnersPending || "Not connected yet",
            kind: "passive",
          };
        }
      }
      if (step.showDualConnectedAppsMockup) {
        out.showTripleConnectedAppsMockup = true;
        delete out.showDualConnectedAppsMockup;
      }
      if (step.statusNote === "hubBothApps") {
        out.statusNote = "hubAllApps";
      }
      if (step.nodeActions && step.nodeActions.auth && step.showDualConnectedAppsMockup) {
        out.nodeActions = Object.assign({}, out.nodeActions || step.nodeActions);
        out.nodeActions.auth = {
          text: "SA + theMarketer + Partners",
          kind: "auth",
          emphasis: true,
        };
      }
      return out;
    }

    function renderStepJump(flowId) {
      const u = getUi();
      const panel = panelIdForFlow(flowId);
      const wrap = document.getElementById("jump-" + panel);
      const total = FLOWS[flowId].steps.length;
      const current = state[flowId];
      wrap.innerHTML = '<span class="step-jump-label">' + u.stepJump + "</span>";
      for (let i = 0; i < total; i++) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className =
          "step-btn" + (i === current ? " current" : i < current ? " done" : "");
        btn.textContent = ExplainerI18n.fmt(u.stepBtn, { n: i + 1, total: total });
        btn.setAttribute(
          "aria-label",
          ExplainerI18n.fmt(u.stepAria, { n: i + 1, total: total })
        );
        btn.addEventListener("click", () => setStep(flowId, i));
        wrap.appendChild(btn);
      }
    }

    function renderDiagram(flowId) {
      const panel = panelIdForFlow(flowId);
      const wrap = document.getElementById("diag-" + panel);
      const flow = FLOWS[flowId];
      let step = flow.steps[state[flowId]];
      if (flow.layout === "hub") {
        step = augmentHubStep(step);
      }
      const u = getUi();
      wrap.innerHTML = "";

      if (flow.layout === "hub") {
        renderHubDiagram(wrap, flow, step);
      } else {
        flow.nodes.forEach((node, i) => {
        if (i > 0) {
          const arr = document.createElement("span");
          const isCallback =
            step.showCallbackArrow &&
            flow.nodes[i - 1].id === "app" &&
            node.id === "auth";
          const isEvent =
            flowId === "revoke" &&
            step.showEventArrow &&
            flow.nodes[i - 1].id === "auth" &&
            node.id === "app";
          const isRedirect =
            (isLoginFlow(flowId) || flowId === "logoutComplete") &&
            step.showRedirectArrow &&
            flow.nodes[i - 1].id === "app" &&
            node.id === "auth";
          const isApi =
            step.showApiArrow &&
            node.id === "auth" &&
            (flow.nodes[i - 1].id === "app" || flow.nodes[i - 1].id === "sendm");
          const isSync =
            step.showSyncArrow &&
            node.id === "auth";
          arr.className = isEvent
            ? "arrow event pulse"
            : isCallback
              ? "arrow redirect flow-active"
              : isRedirect || isSync
              ? "arrow redirect flow-active"
              : isApi
                ? "arrow redirect flow-active"
                : "arrow";
          if (isRedirect) {
            arr.textContent = u.arrows.redirect;
          } else if (isCallback) {
            arr.textContent = "← callback";
          } else if (isSync) {
            arr.textContent = u.arrows.sync;
          } else if (isApi) {
            arr.textContent = u.arrows.roles;
          } else if (isEvent) {
            arr.textContent = "→";
          } else {
            arr.textContent = "→";
            if (node.id === step.active || flow.nodes[i - 1].id === step.active) {
              arr.className += " flow-active";
            }
          }
          wrap.appendChild(arr);
        }
        const el = document.createElement("div");
        el.className = nodeClasses(node, step);
        el.innerHTML =
          nodeIconHtml(node) +
          '<div class="label">' + node.label + "</div>" +
          nodeMockupFor(node, step) +
          nodeActionFor(node, step) +
          nodeHintFor(node, step) +
          badgeFor(node, step);
        wrap.appendChild(el);
      });
      }

      renderNatsReturn(flowId, step);

      const statusEl = document.getElementById("app-status-" + panel);
      if (statusEl) {
        const s = u.status;
        statusEl.className = "app-status";
        if (step.statusNote === "otherApps") {
          statusEl.textContent = s.otherApps;
          statusEl.classList.add("show", "out");
        } else if (step.statusNote === "allApps") {
          statusEl.textContent = s.allApps;
          statusEl.classList.add("show", "out");
        } else if (step.statusNote === "authAlwaysChecks") {
          statusEl.textContent = s.authAlwaysChecks;
          statusEl.classList.add("show", "in");
        } else if (step.statusNote === "saDisconnected") {
          statusEl.textContent = s.saDisconnected;
          statusEl.classList.add("show", "out");
        } else if (step.statusNote === "saAndAuth") {
          statusEl.textContent = s.saAndAuth;
          statusEl.classList.add("show", "in");
        } else if (step.statusNote === "authSessionOnly") {
          statusEl.textContent = s.authSessionOnly;
          statusEl.classList.add("show", "in");
        } else if (step.statusNote === "hubAuthOnly") {
          statusEl.textContent = s.hubAuthOnly;
          statusEl.classList.add("show", "in");
        } else if (step.statusNote === "hubSaConnected") {
          statusEl.textContent = s.hubSaConnected;
          statusEl.classList.add("show", "in");
        } else if (step.statusNote === "hubBothApps") {
          statusEl.textContent = s.hubBothApps;
          statusEl.classList.add("show", "in");
        } else if (step.statusNote === "hubAllApps") {
          statusEl.textContent = s.hubAllApps;
          statusEl.classList.add("show", "in");
        } else if (step.statusNote === "hubOneIdentity") {
          statusEl.textContent = s.hubOneIdentity;
          statusEl.classList.add("show", "in");
        } else if (step.appState === "in") {
          statusEl.textContent = s.saConnected;
          statusEl.classList.add("show", "in");
        } else if (step.appState === "out") {
          statusEl.textContent = s.saDisconnected;
          statusEl.classList.add("show", "out");
        }
      }
    }

    function updateHash() {
      const step = state[currentFlow];
      history.replaceState(null, "", "#" + currentFlow + "/" + step);
    }

    function parseHash() {
      const legacyBrowser = location.hash.match(/^#browser\/(\d+)$/);
      if (legacyBrowser) {
        currentFlow = "browserNoSession";
        state.browserNoSession = Math.min(
          parseInt(legacyBrowser[1], 10),
          FLOWS.browserNoSession.steps.length - 1
        );
        return;
      }
      const m = location.hash.match(/^#(\w+)\/(\d+)$/);
      if (m && FLOWS[m[1]]) {
        currentFlow = m[1];
        state[m[1]] = Math.min(parseInt(m[2], 10), FLOWS[m[1]].steps.length - 1);
      } else if (location.hash === "#revoke") {
        currentFlow = "revoke";
      } else if (location.hash === "#logoutApp") {
        currentFlow = "logoutApp";
      } else if (location.hash === "#logoutComplete") {
        currentFlow = "logoutComplete";
      } else if (location.hash === "#appsOnAuth") {
        currentFlow = "appsOnAuth";
      }
    }

    function renderStep(flowId) {
      const flow = FLOWS[flowId];
      let step = flow.steps[state[flowId]];
      if (flow.layout === "hub") {
        step = augmentHubStep(step);
      }
      const u = getUi();
      const panel = panelIdForFlow(flowId);
      const pct = ((state[flowId] + 1) / flow.steps.length) * 100;

      let title = step.title;
      let text = step.text;
      if (
        hubPartnersMode &&
        flowId === "appsOnAuth" &&
        state[flowId] === flow.steps.length - 1
      ) {
        const h = u.hub || {};
        if (h.step9Title) title = h.step9Title;
        if (h.step9Text) text = h.step9Text;
      }

      document.getElementById("title-" + panel).textContent = title;
      document.getElementById("text-" + panel).textContent = text;
      document.getElementById("meta-" + panel).innerHTML = formatMeta(step.meta || "");

      document.getElementById("live-region").textContent = title + ". " + text;
      document.getElementById("bar-" + panel).style.width = pct + "%";
      document.getElementById("prev-" + panel).disabled = state[flowId] === 0;
      document.getElementById("next-" + panel).disabled =
        state[flowId] >= flow.steps.length - 1;

      renderStepJump(flowId);
      renderScenarioJump();
      renderDiagram(flowId);
      if (flowId === currentFlow) updateHash();
    }

    function setStep(flowId, idx) {
      state[flowId] = Math.max(0, Math.min(FLOWS[flowId].steps.length - 1, idx));
      renderStep(flowId);
    }

    function switchFlow(tabFlowId) {
      clearInterval(autoTimer);
      autoTimer = null;
      autoPlayFlow = null;
      if (tabFlowId === "browser") {
        if (!isLoginFlow(currentFlow)) currentFlow = "browserNoSession";
      } else {
        currentFlow = tabFlowId;
      }
      document.querySelectorAll(".tab").forEach((t) => {
        const active =
          t.dataset.flow === "browser"
            ? isLoginFlow(currentFlow)
            : t.dataset.flow === currentFlow;
        t.classList.toggle("active", active);
      });
      document.querySelectorAll(".panel").forEach((p) => {
        p.classList.toggle("active", p.id === "panel-" + panelIdForFlow(currentFlow));
      });
      document.querySelectorAll('[id^="play-"]').forEach((b) => {
        b.textContent = getUi().play;
      });
      renderStep(currentFlow);
    }

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 2000);
    }

    function copyShareLink(panelId) {
      const u = getUi();
      const flowId = activeFlowForPanel(panelId);
      const url = location.origin + location.pathname + "#" + flowId + "/" + state[flowId];
      navigator.clipboard.writeText(url).then(
        () => showToast(u.toastCopied),
        () => showToast(u.toastFailed)
      );
    }

    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => switchFlow(tab.dataset.flow));
    });

    PANEL_IDS.forEach((panelId) => {
      document.getElementById("prev-" + panelId).addEventListener("click", () => {
        const flowId = activeFlowForPanel(panelId);
        setStep(flowId, state[flowId] - 1);
      });
      document.getElementById("next-" + panelId).addEventListener("click", () => {
        const flowId = activeFlowForPanel(panelId);
        setStep(flowId, state[flowId] + 1);
      });
      document.getElementById("reset-" + panelId).addEventListener("click", () => {
        clearInterval(autoTimer);
        autoTimer = null;
        autoPlayFlow = null;
        document.getElementById("play-" + panelId).textContent = getUi().play;
        const flowId = activeFlowForPanel(panelId);
        setStep(flowId, 0);
      });
      document.getElementById("share-" + panelId).addEventListener("click", () => {
        copyShareLink(panelId);
      });
      document.getElementById("play-" + panelId).addEventListener("click", () => {
        const u = getUi();
        const btn = document.getElementById("play-" + panelId);
        const flowId = activeFlowForPanel(panelId);
        if (autoTimer && autoPlayFlow === flowId) {
          clearInterval(autoTimer);
          autoTimer = null;
          autoPlayFlow = null;
          btn.textContent = u.play;
          return;
        }
        clearInterval(autoTimer);
        autoTimer = null;
        btn.textContent = u.stop;
        autoPlayFlow = flowId;
        setStep(flowId, 0);
        autoTimer = setInterval(() => {
          if (state[flowId] >= FLOWS[flowId].steps.length - 1) {
            clearInterval(autoTimer);
            autoTimer = null;
            autoPlayFlow = null;
            btn.textContent = u.play;
            return;
          }
          setStep(flowId, state[flowId] + 1);
        }, 2000);
      });
    });

    document.addEventListener("keydown", (e) => {
      if (e.target.matches("input, textarea")) return;
      if (e.key === "ArrowLeft") {
        e.preventDefault();
        setStep(currentFlow, state[currentFlow] - 1);
      } else if (e.key === "ArrowRight") {
        e.preventDefault();
        setStep(currentFlow, state[currentFlow] + 1);
      } else if (e.key === "p" || e.key === "P") {
        if (currentFlow === "appsOnAuth") {
          e.preventDefault();
          toggleHubPartners();
        }
      } else if (e.key === "Escape" && document.body.classList.contains("present")) {
        document.body.classList.remove("present");
        document.getElementById("present-toggle").textContent = getUi().present;
      }
    });

    document.getElementById("present-toggle").addEventListener("click", function () {
      const u = getUi();
      const on = document.body.classList.toggle("present");
      this.textContent = on ? u.presentExit : u.present;
    });

    ExplainerI18n.mountLangSwitch(document.getElementById("lang-switch"), reloadLang);
    applyPageLang();
    parseHash();
    switchFlow(isLoginFlow(currentFlow) ? "browser" : currentFlow);
  </script>
</body>
</html>
